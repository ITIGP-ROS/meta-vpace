require conf/distro/tegrademo.conf

DISTRO = "vpace"
DISTRO_NAME = "V-PACE Distribution"
DISTRO_VERSION_BASE = "1.0"
DISTRO_VERSION = "${DISTRO_VERSION_BASE}.0"


# needed to pypass the qa-sanity of the tegrademo that our distro builds upon
INHERIT:remove = "tegra-support-sanity"

DISTRO_FEATURES:append = " wayland"
DISTRO_FEATURES:remove = " x11"
# not needed for now so we remove them
DISTRO_FEATURES:remove = " ptest debuginfod virtualization nfc 3g pcmcia zeroconf nfs "
# since we dont need the virtualization (no docker) 
BBMASK += "docker-moby_%.bbappend"


PACKAGECONFIG:append:pn-ivi-ota-agent = " ros2-coordination"

PACKAGECONFIG:pn-camera-sign-detect-bringup = "trt"

# Builds rdp-backend.so, which weston-remote-display needs to serve the head unit
# without a physical panel. Pinned here rather than left in a build's local.conf so a
# fresh clone of this layer produces a working toggle -- local.conf is not tracked,
# and the failure without this is a silent one (weston starts, the RDP backend module
# is simply absent).
PACKAGECONFIG:append:pn-weston = " rdp"

# Builds opusenc/opusdec, which ivi-remote-mic needs to decode the Opus/RTP stream that
# stands in for this board's (nonexistent) microphone. Not in poky's default set for
# gst-plugins-base; libopus comes from meta-oe, already in bblayers.
#
# Opus rather than raw L16 because the link is usually WiFi: ~24 kbps instead of 256,
# and packet-loss concealment that reconstructs across a dropped frame. The RTP
# payloaders are in plugins-good and are present regardless of this line -- only the
# codec itself is gated here.
PACKAGECONFIG:append:pn-gstreamer1.0-plugins-base = " opus"


# Qt6 platform
# QT_QPA_PLATFORM = "wayland"
# QT_QPA_PLATFORMTHEME = "gtk2"