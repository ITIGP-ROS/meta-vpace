# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-vpace"
BBFILE_PATTERN_meta-vpace = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-vpace = "6"

# Direct dependencies only -- each entry below is something a recipe, bbappend, class
# inherit or the distro conf in THIS layer references by name. Layers that only arrive
# transitively (meta-python, for instance, pulled in by qt6-layer and the ros layers) are
# deliberately absent.
#
#   core                -- oe-core.
#   tegra               -- meta-tegra: cuda.bbclass (inherited by the CUDA-built ROS
#                          recipes and bbappends), tensorrt-core, tegra-tools-jetson-clocks,
#                          the gstreamer1.0-plugins-nv* elements, and the target of
#                          recipes-kernel/linux/linux-jammy-nvidia-tegra_5.15.bbappend.
#   tegrademo           -- meta-tegrademo: conf/distro/vpace.conf requires
#                          conf/distro/tegrademo.conf, orinivi-image requires
#                          recipes-demo/images/demo-image-weston.bb, and the
#                          swupdate-image-tegra / swupdate-machine-config bbappends target
#                          recipes that live in its dynamic-layers/meta-swupdate.
#   swupdate            -- meta-swupdate: swupdate.bbclass and the swupdate recipe that
#                          recipes-bbappends/swupdate appends.
#   openembedded-layer  -- meta-oe: libmtp (ivi-mtp-mount), libopus (the gst-plugins-base
#                          PACKAGECONFIG in the distro conf), can-utils, ttf-noto-emoji.
#   networking-layer    -- meta-networking: networkmanager/networkmanager-nmcli and
#                          mosquitto-clients (ivi-ota-agent, jetson-status-agent).
#   filesystems-layer   -- meta-filesystems: simple-mtpfs, the FUSE MTP filesystem
#                          ivi-mtp-mount is built around.
#   qt6-layer           -- meta-qt6: qt6-cmake.bbclass and the qt* runtime the IVI app
#                          links against.
#   ros-common-layer    -- meta-ros: python3-lark-parser, pulled in by the
#                          spatio-temporal-voxel-layer bbappend.
#   ros2-layer          -- meta-ros: ROS 2 infrastructure, and the tl-expected recipe that
#                          recipes-bbappends/tl-expected appends.
#   ros2-humble-layer   -- meta-ros: ros_distro_humble.bbclass, ros_ament_cmake.bbclass and
#                          every upstream ROS package this layer appends or installs.
#
# NOTE: conf/distro/vpace.conf does INHERIT:remove = "tegra-support-sanity", which names a
# class from meta-tegra-support. That is a removal, so it is a no-op when the layer is
# absent -- it is not a dependency and must not be listed here.
LAYERDEPENDS_meta-vpace = " \
    core \
    tegra \
    tegrademo \
    swupdate \
    openembedded-layer \
    networking-layer \
    filesystems-layer \
    qt6-layer \
    ros-common-layer \
    ros2-layer \
    ros2-humble-layer \
"

LAYERSERIES_COMPAT_meta-vpace = "scarthgap"

# pre-accept commercial licenses 
LICENSE_FLAGS_ACCEPTED += " commercial_gstreamer1.0-plugins-ugly "