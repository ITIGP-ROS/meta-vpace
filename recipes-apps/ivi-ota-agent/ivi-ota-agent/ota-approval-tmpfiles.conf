# OTA approval spool. /run is a tmpfs, so this has to be recreated every boot —
# without it the IVI app never sees an offer and its liveness file never exists,
# which (with ON_NO_UI=approve) means every update installs silently and nothing
# looks broken.
#
# The permissions ARE the security model. See IVI/OTA_APPROVAL_PROTOCOL.md.
#
#   offers/   root-writable, world-readable — producers write, the app reads
#   verdicts/ 0730 root:weston — the app (running as weston) can CREATE a file
#             here but cannot list the directory or read anything in it. It can
#             answer a question; it cannot ask one, and it cannot see anyone
#             else's answer.
#   ui-alive  owned by weston so the unprivileged app can keep rewriting it.

d /run/ota-approval          0755 root   root   -
d /run/ota-approval/offers   0755 root   root   -
d /run/ota-approval/verdicts 0730 root   weston -
f /run/ota-approval/ui-alive 0664 weston weston -
