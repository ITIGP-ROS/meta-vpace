# bluetoothd policy. THE ONLY REASON THIS FILE EXISTS IS [Policy] AutoEnable.
#
# bluez5 installs input.conf and network.conf into /etc/bluetooth (see bluez5.inc in
# poky) but ships NO main.conf, so bluetoothd falls back to its compiled-in defaults
# and leaves the adapter DOWN after every boot. Everything else on the Bluetooth path
# was already correct -- btusb/btintel/btrtl/btbcm and linux-firmware-ibt-12-16 are in
# orinivi-image.bb, kernel-module-uhid gives us /dev/uhid, bluetooth.service is enabled
# -- and this one missing file was the entire reason a wireless gamepad did not work
# without somebody first ssh-ing in and running `hciconfig hci0 up`.
#
# Verified on the board 2026-08-22 by reproducing the boot condition exactly
# (`hciconfig hci0 down` then `systemctl restart bluetooth`): with AutoEnable=true the
# adapter came back UP RUNNING / Powered: yes, unattended.
#
# Only the settings we deliberately depart from are listed. Everything omitted keeps
# bluez's default on purpose -- an inherited full upstream main.conf would bury the one
# line that matters in ~150 lines of defaults, and would silently pin those defaults to
# whatever they were at the version it was copied from.

[Policy]
# Power the adapter on at boot and after a bluetoothd restart, with no operator action.
# The target end state is "power on the board, power on the gamepad, drive".
AutoEnable=true
