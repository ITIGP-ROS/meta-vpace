# Learned WiFi profiles go on /data, not the rootfs -- the rootfs is the A/B pair
# SWUpdate replaces wholesale, so every flash would otherwise forget every network.
#
# `path` replaces NM's writable store, not adds to it -- /etc/NetworkManager/
# system-connections stops being read. static-eth.nmconnection lives under
# /usr/lib instead, which NM always reads regardless of `path`.
#
# The target directory must be 0700 root:root -- NetworkManager silently ignores any
# keyfile with looser permissions (they hold PSKs in the clear). Created at boot by
# mount-data-partition.sh.
#
# Profiles alone aren't enough to reconnect to the *last working* network -- see
# nm-state-on-data.conf, which persists timestamps and seen-bssids.

[keyfile]
path=/data/network/system-connections
