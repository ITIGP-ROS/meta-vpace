# Learned WiFi profiles go on /data, not on the rootfs.
#
# WHY
#
# `nmcli device wifi connect ...` writes a keyfile per network into NetworkManager's
# writable store, which defaults to /etc/NetworkManager/system-connections. That is on
# the A/B rootfs pair (nvme0n1p1/p2) that SWUpdate replaces wholesale, so every flash
# forgets every network the vehicle has ever joined and the board comes up needing a
# keyboard and a monitor. /data is nvme0n1p15 and survives.
#
# `path` is the documented [keyfile] knob for exactly this: "the location where keyfiles
# are read and stored".
#
# ============================================================================
# THE THREE THINGS THAT ARE EASY TO GET WRONG
#
# 1. THIS TAKES /etc/NetworkManager/system-connections OUT OF THE SEARCH SET.
#
#    `path` REPLACES the writable store, it does not add to it. Any profile still sitting
#    in /etc after this lands is simply not read any more, with no error. That is why
#    static-eth.nmconnection is installed by nm-config.bb into
#    /usr/lib/NetworkManager/system-connections instead -- one of the two read-only
#    directories NetworkManager always reads regardless of `path`, and the conventional
#    home for a profile that ships with the image rather than being learned on the box.
#
#    If the LiDAR link ever goes dead right after a NetworkManager change, check that
#    static-eth is still being read before suspecting the cable or the sensor.
#
# 2. THE DIRECTORY MUST BE 0700 root:root.
#
#    These files hold WiFi PSKs in the clear, so NetworkManager IGNORES any keyfile that
#    is readable or writable by a user or group other than root. A loose mode does not
#    warn -- the networks just stop being remembered. mount-data-partition.sh creates the
#    directory with the right mode at boot; nothing stages it at image build time,
#    because a mount point cannot be populated from the rootfs.
#
# 3. PROFILES ALONE ARE NOT ENOUGH -- SEE THE BindPaths= DROP-IN.
#
#    This file persists the credentials. It does NOT persist
#    /var/lib/NetworkManager/timestamps, which is what decides WHICH saved profile wins
#    when several are in range, or seen-bssids, which is how hidden SSIDs are found at
#    all. Those are handled by nm-state-on-data.conf. Persisting one without the other
#    gives a board that reconnects, but to an arbitrary remembered network rather than
#    the last one that actually worked.
#
# NOTE ON SCALE: keeping every network ever joined costs nothing worth optimising. A
# keyfile is a few hundred bytes, and NetworkManager does not try them in turn -- a WiFi
# profile is only a candidate when its SSID is in the current scan results, so the set it
# actually chooses between is normally one or two. The exception is hidden networks
# (hidden=true), which cannot be found passively and are actively probed for on every
# scan; those are worth pruning, ordinary ones are not.
# ============================================================================

[keyfile]
path=/data/network/system-connections
