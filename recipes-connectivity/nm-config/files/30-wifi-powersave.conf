# Disable WiFi power save -- not a power optimisation here, a latency bug. In power
# save the AP buffers downlink frames until the next DTIM beacon (uplink is
# unaffected), which is easy to misread as a bad link. Measured: downlink worst-case
# latency dropped from ~306ms to ~4ms with this off; a max latency that's a clean
# multiple of the beacon interval is the tell.
#
# conf.d, not the profile: WiFi profiles are learned at runtime with no shipped
# keyfile to edit; [connection] here covers every network the vehicle ever joins.
#
# 2 = disable, not 1 = leave-alone -- 1 keeps iwlwifi's power-save-on default.
[connection]
wifi.powersave=2
