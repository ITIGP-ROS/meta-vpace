# Disable WiFi power save. It is not a power optimisation on this vehicle, it is a
# latency bug.
#
# WHAT IT COSTS
#
# In power save the client tells the AP it is sleeping, and the AP BUFFERS downlink
# frames until the next DTIM beacon. Uplink is unaffected -- the client transmits
# whenever it wants -- so the damage is one-directional and easy to misread as a bad
# link or a bad AP.
#
# Measured on the unit over a MiFi at -27 dBm, 60 pings each way:
#
#   path                     min /  avg /   max      mdev
#   Jetson -> AP  (uplink)   1.20 / 1.63 /   3.60      --      always fine
#   laptop -> AP             1.11 / 2.22 /   9.88     1.55     always fine
#   laptop -> Jetson  ON     2.03 / 22.77 / 306.49   59.08     <-- the problem
#   laptop -> Jetson  OFF    2.03 /  2.61 /   4.41    0.66
#
# 8.7x better average, 69x better worst case, 90x less jitter. Bulk transfer improved
# too, but far less (51/53 -> 60/65 Mbit/s), which is the tell: this throttles latency,
# not bandwidth.
#
# HOW TO RECOGNISE IT AGAIN
#
# The worst case pins to ONE BEACON INTERVAL. `iw dev <dev> link` reported
# "beacon int: 100" and "dtim period: 1", and the observed max was 96-306 ms -- i.e.
# one to three beacons of buffering. If a link ever shows a max latency that is a clean
# multiple of the beacon interval, suspect power save before suspecting RF.
#
# Crucially, the radio was NOT at fault and said so: 78 tx retries in 145128 packets
# (0.05%), 0 tx failed, 0 beacon loss, MCS 15 at 40 MHz. Interference and congestion
# both show up as retries and rate downshifts. Neither was present. Chasing antennas,
# channels or AP placement on these numbers would have found nothing.
#
# WHY A conf.d DROP-IN AND NOT THE PROFILE
#
# WiFi profiles here are LEARNED at runtime and live in /data (see 20-keyfile-path.conf),
# so there is no shipped keyfile to put `powersave=` in, and any per-profile setting would
# have to be repeated for every network the vehicle ever joins. `[connection]` in conf.d
# applies to every connection that does not override it, including ones created later by
# `nmcli device wifi connect`.
#
# 2 means "disable". The values are 0=use-global-default, 1=leave-alone, 2=disable,
# 3=enable -- note that 1 and 2 are NOT synonyms: 1 tells NetworkManager not to touch
# whatever the driver defaults to, which for iwlwifi is power save ON. Only 2 turns it off.
#
# NOTE: `iw dev <dev> set power_save off` fixes this only until the next reconnect or
# reboot, because NetworkManager reapplies its own setting on each activation. Runtime
# testing is fine; this file is what makes it stick.
[connection]
wifi.powersave=2
