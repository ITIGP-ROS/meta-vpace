# NM's runtime state (/var/lib/NetworkManager) is on the rootfs and wiped by every
# flash -- 20-keyfile-path.conf persists profiles but not timestamps/seen-bssids, so
# without this bind mount the board reconnects to an arbitrary saved network.
#
# The leading "-" matters: it makes systemd skip the bind mount instead of failing
# the unit if /data isn't mounted yet -- losing NetworkManager here means losing
# WiFi/SSH entirely, a worse failure than stale state.

[Service]
BindPaths=-/data/network/nm-state:/var/lib/NetworkManager
