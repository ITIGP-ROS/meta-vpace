# NetworkManager's state directory on /data, so the board remembers WHICH network
# to rejoin after a flash -- not just the passwords.
#
# 20-keyfile-path.conf moves the learned profiles to /data. That alone is not enough.
# NetworkManager keeps its runtime state in /var/lib/NetworkManager, which is on the
# rootfs and is wiped by exactly the same flash:
#
#   timestamps    when each profile last connected successfully. This is the tie-break
#                 that picks a winner when several saved networks are in range and all
#                 sit at the default autoconnect-priority of 0 -- i.e. it is the entire
#                 mechanism behind "reconnect to the last network that worked". It is
#                 also NetworkManager's record that a network HAS connected before,
#                 used to decide whether to re-prompt for the PSK.
#   seen-bssids   the BSSIDs seen per network. This is how hidden SSIDs are found at all.
#   secret_key    machine identity seed for stable-ids and generated MAC addresses.
#   NetworkManager.state   the WiFi radio enable flag (harmless if lost, defaults on).
#
# Lose these and the board still autoconnects, but with more than one saved network
# in range the choice is effectively arbitrary instead of "the last one that worked",
# and a hidden network may never be found.
#
# There is no [keyfile] path= equivalent for this directory -- NetworkManager's
# --state-file only relocates NetworkManager.state -- so it takes a bind mount. Doing it
# as a unit drop-in keeps it scoped to this one service and out of /etc/fstab.
#
# ============================================================================
# THE LEADING "-" IS THE IMPORTANT CHARACTER ON THIS LINE. DO NOT REMOVE IT.
#
# It makes systemd SKIP the bind mount when /data/network/nm-state does not exist,
# instead of refusing to start the unit. Without it, a board whose /data failed to mount
# has no NetworkManager -- which means no WiFi, which means NO SSH, on a vehicle whose
# only other interface is a LiDAR-only link with never-default=true. That is a recovery
# job with a serial console, caused by a partition problem that would otherwise have been
# a minor annoyance.
#
# This is deliberately the OPPOSITE trade-off to update-coordinator.service, which has
# ExecStartPre=/bin/mountpoint -q /data and fails closed. The two differ because their
# failure modes differ: a coordinator that will not start costs a delayed OTA and says so
# loudly, while a NetworkManager that will not start costs remote access to the board.
# Silently falling back to rootfs state is the cheaper failure HERE and only here.
#
# The cost of the "-" is that a missing /data degrades to non-persistent state without
# complaint. Check `findmnt /var/lib/NetworkManager` if profiles stop being remembered.
# ============================================================================

[Service]
BindPaths=-/data/network/nm-state:/var/lib/NetworkManager
