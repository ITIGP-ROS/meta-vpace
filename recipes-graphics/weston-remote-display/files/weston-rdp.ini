# Weston configuration for REMOTE DISPLAY over RDP.
#
# Not the production config (/etc/xdg/weston/weston.ini is) -- only used while
# `weston-remote-display on` is active. Keep non-remote settings in sync with weston.ini.
#
# Mirrors the DRM output instead of using rdp-backend.so directly: pointing Weston at
# the RDP backend with renderer=gl brings the compositor up fine on NVIDIA's surfaceless
# EGL, but no GL client can then allocate a buffer (EGL_BAD_ALLOC) since NVIDIA's
# wayland-egl needs a device-bound EGLDisplay to share buffers with clients. Mirroring
# the real drm-backend+GBM output sidesteps that -- only the mirror is CPU-encoded.
#
# The mirror's CPU cost is real: unthrottled, it costs ~2 full cores encoding every
# repaint at full resolution. 0002-screen-share-throttle-mirror-framerate.patch in the
# weston bbappend caps it at ~24fps, which is required at this resolution, not optional.

[core]
shell=kiosk-shell.so

# Tightened from the default 7ms to reduce repaint latency. Not validated on hardware --
# Weston's docs warn too tight a window can cause missed vblanks instead. Revert to 7
# (or drop the line) if RDP/panel show new stutter after this change.
repaint-window=3

# No backend= line on purpose -- defaults to drm-backend.so, keeping clients on the GPU.
# screen-share.so spawns the mirror; safe alongside weston.service's own --modules,
# which is additive, not a replacement.
modules=screen-share.so

# With no panel attached there may be no input device at startup, and weston refuses
# to start on an empty seat unless told not to care.
require-input=false
idle-time=0

# No mode= line: resolution comes from the connector's EDID (synthetic 2048x1200 from
# weston-force-output when no panel is attached, or the real panel's preferred mode).
# Hardcoding mode= here would force synthetic timing onto real hardware.
#
# No [output] section, so scale stays 1. HiDPI scaling is done client-side via
# QT_SCALE_FACTOR=2 (see weston-force-output and ivi-app.service) instead of the
# textbook [output] scale=2 -- that was tried and does not work correctly on this
# weston 13.0.1 + kiosk-shell.so + NVIDIA + Qt combination (fullscreens to the wrong
# logical size, or only renders into a corner of the output). Don't re-add it here.

[screen-share]
# The nested compositor running the RDP backend; only mirrors, never touches app
# rendering. TLS args are required (RDP backend won't start without them) and passed
# on the command line since this nested instance gets no --config.
command=/usr/bin/weston --backend=rdp-backend.so --shell=fullscreen-shell.so --no-clients-resize --rdp-tls-cert=/etc/weston-rdp/tls.crt --rdp-tls-key=/etc/weston-rdp/tls.key
# Without this the mirror only starts on a keybinding, useless with no keyboard attached.
start-on-startup=true

[libinput]
enable_tap=true
