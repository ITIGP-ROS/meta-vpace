# Weston configuration for REMOTE DISPLAY over RDP.
#
# This file is NOT the production config. /etc/xdg/weston/weston.ini is. Weston is
# pointed here only while `weston-remote-display on` is in effect.
#
# Keep the non-remote settings in sync with weston.ini — this is the same head unit,
# just also mirrored over the network.
#
# ============================================================================
# WHY THIS MIRRORS THE DRM OUTPUT INSTEAD OF USING THE RDP BACKEND DIRECTLY
#
# The obvious design — point Weston at rdp-backend.so with renderer=gl — is a dead
# end on this board, and it fails in a way that looks like it is working.
#
# The compositor half is fine. Weston brings up the GL renderer on NVIDIA's
# surfaceless EGL display and logs everything you want to see:
#
#     Loading module '/usr/lib/libweston-13/rdp-backend.so'
#     Loading module '/usr/lib/libweston-13/gl-renderer.so'
#     EGL vendor: NVIDIA          surfaceless context: yes
#     GL renderer: NVIDIA Tegra Orin (nvgpu)/integrated
#     Using GL renderer
#
# But no GL CLIENT can then allocate a buffer against it:
#
#     client:     qt.qpa.wayland: Could not create EGL surface (EGL error 0x3003)
#     compositor: eglQueryWaylandBufferWL failed
#
# 0x3003 is EGL_BAD_ALLOC. This is not a Qt problem — weston-simple-egl fails
# identically while weston-simple-shm succeeds, so it is every GL client. NVIDIA's
# client-side wayland-egl needs the compositor's EGLDisplay to be bound to a real GPU
# device to share buffers; the surfaceless display (EGL_DEFAULT_DISPLAY, no DRM
# device) can render the compositor's own FBO but cannot serve clients. So the
# compositor would be on the GPU and the app would be dead — the exact opposite of
# what this feature is for.
#
# Mirroring the DRM output sidesteps it entirely. The main compositor stays on
# drm-backend + GBM, which is a device-bound EGLDisplay, so clients get real GPU
# buffers exactly as they do on HDMI. Only the mirror is encoded on the CPU.
#
# MEASURED COST at 1024x600, on the bench, no panel attached:
#     qml: [stats] fps=51 frame=16.29 render=14.41 draws=99 verts=122808 passes=2
#
# RE-MEASURED 2026-08-22 at 2048x1200 (4x the pixels), live over RDP:
#     qml: [stats] frame=26.46 render=26.14 sync=0.14 draws=99 verts=122808 passes=2
#
# So the APP's own render cost went 14.41ms -> 26.14ms. That is ~1.8x, not the 4x the
# pixel count would suggest -- the scene is the same 99 draws / 122808 verts, it is only
# fill-rate that grew -- and it still clears a 30fps budget.
#
# THE APP IS NOT THE PROBLEM. The nested RDP mirror is. Measured at the same moment,
# `top` on this 6-core board:
#     weston --backend=rdp-backend.so ...   ~200% CPU   <- the mirror, 2 full cores
#     weston --config=weston-rdp.ini        ~14%  CPU   <- the real compositor
#     appIVI                                ~17%  CPU   <- the IVI itself
# The mirror does a readback + pixman composite + RemoteFX encode of the whole
# 2048x1200 frame on EVERY compositor repaint, with no rate limit, on the CPU. That
# cost is linear in pixels, so it is the one thing that genuinely got 4x worse.
#
# This is why 0002-screen-share-throttle-mirror-framerate.patch in the weston bbappend
# is REQUIRED rather than a nice-to-have at this resolution. Those numbers above were
# taken WITHOUT it applied. On a vehicle sharing these 6 cores with ROS nodes, giving
# two of them to an unthrottled screen mirror is not acceptable; capping the mirror at
# ~24fps cuts it roughly in proportion without touching app render latency at all.
# ============================================================================

[core]
shell=kiosk-shell.so

# Default is 7ms. This is how long the compositor waits after vblank before it
# samples client surfaces for the next repaint -- giving the app a window to
# post a fresh frame in time to be included, at the cost of that much delay
# between the app actually drawing something and it becoming visible (and, via
# the mirror, RDP-visible). Tightened as a small, free part of the latency
# work alongside the mirror-framerate throttle in the `weston` bbappend.
#
# NOT VALIDATED ON HARDWARE. Weston's own docs warn a window this tight can
# make the compositor miss its vblank target, which INCREASES output latency
# instead of reducing it -- the opposite of the intent. If RDP or the local
# panel feel worse (stutter, not just "still laggy") after this change, revert
# to 7 (or drop the line, which is the same default) before looking anywhere
# else.
repaint-window=3

# No backend= line on purpose: weston_choose_default_backend() picks drm-backend.so,
# same as the production weston.ini. THIS is what keeps clients on the GPU.
#
# screen-share.so is what spawns the mirror. Listing it here is safe alongside the
# --modules=systemd-notify.so that poky's weston.service passes -- main() loads
# [core] modules and --modules additively, it does not replace one with the other.
modules=screen-share.so

# With no panel attached there may be no input device at startup, and weston refuses
# to start on an empty seat unless told not to care.
require-input=false
idle-time=0

# No mode= line, and it must stay that way.
#
# The resolution is set by the connector's EDID, not from here. With no panel,
# weston-force-output installs a synthetic EDID whose preferred mode is 2048x1200 --
# exactly 2x the 1024x600 the IVI QML is laid out for -- so weston picks it up on its
# own. With a real panel attached, that EDID is never installed and weston takes the
# panel's own preferred mode.
#
# Hardcoding `mode=` here would break the second case by forcing our synthetic timing
# onto real hardware. And a bare `mode=2048x1200` does not work anyway: it only selects
# from modes the connector already reports. See weston-force-output for the details.
#
# THERE IS DELIBERATELY NO [output] SECTION, so the output stays at scale=1.
# The HiDPI scaling is done CLIENT-side instead, by QT_SCALE_FACTOR=2 -- see
# weston-force-output (which decides it and writes /run/ivi-scale.env) and
# ivi-app.service (which reads it). Do not "fix" this by adding scale=2 here.
#
# [output] scale=2 IS THE TEXTBOOK WAY TO DO THIS AND IT DOES NOT WORK HERE.
# The theory -- Qt renders at 2x device-pixel-ratio while the logical window stays
# 1024x600, via the standard Wayland output-scale protocol, no client changes needed --
# does not hold up on this weston 13.0.1 + kiosk-shell.so + NVIDIA + Qt combination.
# First attempt (name=HDMI-A-1, wrong connector -- the real one is DP-1, confirmed via
# `cat /sys/class/drm/card*-*/status`) never matched anything, so scale=2 silently never
# applied and the app got fullscreened to a 2048x1200 *logical* window instead
# (proportions broken, one very slow first frame). Second attempt, name=DP-1 (matching),
# was worse: the app rendered into only the top-left ~1024x600 of the 2048x1200 physical
# output, the rest solid black -- kiosk-shell did NOT scale the client's buffer up to
# fill the scaled output the way a desktop shell would, it just placed it 1:1. That was
# never root-caused, and it did not need to be: driving the scale from the client side
# keeps the compositor on the plain scale=1 path and never enters the broken code at all.
#
# WHAT ACTUALLY WORKS (verified on the board via WAYLAND_DEBUG on the running app):
#     wl_output.mode(2048, 1200)                      <- from the synthetic EDID
#     wl_output.scale(1)                              <- compositor NOT scaling
#     zxdg_output_v1.logical_size(2048, 1200)         <- logical == physical
#     xdg_toplevel.configure(2048, 1200)              <- kiosk-shell fullscreens us
#     xdg_surface.set_window_geometry(0, 0, 2048, 1200)  <- full output, no offset
#     zwp_linux_buffer_params.create_immed(..., 2048, 1200, ...)  <- real 2048x1200 buffer
#     wl_surface.set_buffer_scale(1)                  <- buffer maps 1:1 to the surface
# Qt then divides by QT_SCALE_FACTOR=2 internally, so QML lays out at exactly 1024x600
# (what Main.qml is written for) and renders it into that 2048x1200 buffer: identical
# layout, 4x the pixels for the mirror to carry. Confirmed visually over RDP.
#
# NOTE this also makes the screen-share "full resolution" patch in the weston bbappend
# unnecessary: that patch swapped so->output->width for so->output->current_mode->width,
# and libweston/compositor.c:6939 computes output->width as current_mode->width / scale,
# so at scale=1 the two are identical by definition. It is a no-op on this path.

[screen-share]
# The nested compositor. It is the one running the RDP backend, and it only ever
# composites a single fullscreen mirrored surface -- so its renderer (pixman, since
# no renderer is requested) costs nothing and never touches app rendering.
#
# The TLS arguments are required: weston's RDP backend refuses to start with neither
# a certificate nor an RDP4 key. They are passed on the command line because this
# nested instance does not read our [rdp] section -- it gets no --config at all.
command=/usr/bin/weston --backend=rdp-backend.so --shell=fullscreen-shell.so --no-clients-resize --rdp-tls-cert=/etc/weston-rdp/tls.crt --rdp-tls-key=/etc/weston-rdp/tls.key
# Without this the mirror only starts on a keybinding (ctrl+alt+s), which is no use
# on a board with no keyboard attached.
start-on-startup=true

[libinput]
enable_tap=true
