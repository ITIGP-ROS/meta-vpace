# Weston configuration for REMOTE DISPLAY over RDP.
#
# This file is NOT the production config. /etc/xdg/weston/weston.ini is. Weston is
# pointed here only while `weston-remote-display on` is in effect.
#
# Keep the non-remote settings in sync with weston.ini — this is the same head unit,
# just also mirrored over the network.
#
# ============================================================================
# WHY THIS MIRRORS THE DRM OUTPUT INSTEAD OF USING THE RDP BACKEND DIRECTLY
#
# The obvious design — point Weston at rdp-backend.so with renderer=gl — is a dead
# end on this board, and it fails in a way that looks like it is working.
#
# The compositor half is fine. Weston brings up the GL renderer on NVIDIA's
# surfaceless EGL display and logs everything you want to see:
#
#     Loading module '/usr/lib/libweston-13/rdp-backend.so'
#     Loading module '/usr/lib/libweston-13/gl-renderer.so'
#     EGL vendor: NVIDIA          surfaceless context: yes
#     GL renderer: NVIDIA Tegra Orin (nvgpu)/integrated
#     Using GL renderer
#
# But no GL CLIENT can then allocate a buffer against it:
#
#     client:     qt.qpa.wayland: Could not create EGL surface (EGL error 0x3003)
#     compositor: eglQueryWaylandBufferWL failed
#
# 0x3003 is EGL_BAD_ALLOC. This is not a Qt problem — weston-simple-egl fails
# identically while weston-simple-shm succeeds, so it is every GL client. NVIDIA's
# client-side wayland-egl needs the compositor's EGLDisplay to be bound to a real GPU
# device to share buffers; the surfaceless display (EGL_DEFAULT_DISPLAY, no DRM
# device) can render the compositor's own FBO but cannot serve clients. So the
# compositor would be on the GPU and the app would be dead — the exact opposite of
# what this feature is for.
#
# Mirroring the DRM output sidesteps it entirely. The main compositor stays on
# drm-backend + GBM, which is a device-bound EGLDisplay, so clients get real GPU
# buffers exactly as they do on HDMI. Only the mirror is encoded on the CPU.
#
# Measured on the bench with this config, no panel attached:
#     qml: [stats] fps=51 frame=16.29 render=14.41 draws=99 verts=122808 passes=2
# ============================================================================

[core]
shell=kiosk-shell.so

# No backend= line on purpose: weston_choose_default_backend() picks drm-backend.so,
# same as the production weston.ini. THIS is what keeps clients on the GPU.
#
# screen-share.so is what spawns the mirror. Listing it here is safe alongside the
# --modules=systemd-notify.so that poky's weston.service passes -- main() loads
# [core] modules and --modules additively, it does not replace one with the other.
modules=screen-share.so

# With no panel attached there may be no input device at startup, and weston refuses
# to start on an empty seat unless told not to care.
require-input=false
idle-time=0

# Deliberately NO [output] section, and it must stay that way.
#
# The resolution is set by the connector's EDID, not from here. With no panel,
# weston-force-output installs a synthetic EDID whose preferred mode is 1024x600 --
# the resolution the IVI QML is laid out for -- so weston picks it up on its own. With
# a real panel attached, that EDID is never installed and weston takes the panel's own
# preferred mode.
#
# Hardcoding `mode=` here would break the second case by forcing our synthetic timing
# onto real hardware. And a bare `mode=1024x600` does not work anyway: it only selects
# from modes the connector already reports. See weston-force-output for the details.

[screen-share]
# The nested compositor. It is the one running the RDP backend, and it only ever
# composites a single fullscreen mirrored surface -- so its renderer (pixman, since
# no renderer is requested) costs nothing and never touches app rendering.
#
# The TLS arguments are required: weston's RDP backend refuses to start with neither
# a certificate nor an RDP4 key. They are passed on the command line because this
# nested instance does not read our [rdp] section -- it gets no --config at all.
command=/usr/bin/weston --backend=rdp-backend.so --shell=fullscreen-shell.so --no-clients-resize --rdp-tls-cert=/etc/weston-rdp/tls.crt --rdp-tls-key=/etc/weston-rdp/tls.key
# Without this the mirror only starts on a keybinding (ctrl+alt+s), which is no use
# on a board with no keyboard attached.
start-on-startup=true

[libinput]
enable_tap=true
