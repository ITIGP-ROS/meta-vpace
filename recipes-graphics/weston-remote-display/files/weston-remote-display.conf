# Vendor drop-in: remote display is ON by default.
#
# Installed to /usr/lib/systemd/system/weston.service.d/ so a freshly flashed board
# mirrors the head unit over RDP without anyone having to run anything.
#
# `weston-remote-display off` does NOT delete this file. It writes a file with the
# SAME NAME into /etc/systemd/system/weston.service.d/, and systemd resolves same-named
# drop-ins by directory priority (/etc beats /run beats /usr/lib), so the /etc copy
# replaces this one wholesale -- taking the Wants= with it. `on` deletes that override
# and this file is back in force. Package files are never edited at runtime.
#
# COST OF LEAVING IT ON (measured on p3768-0000-p3767-0001, 6 cores, 1024x600):
#   nobody connected : weston 29% + mirror 11% of one core, app stays at 60 fps
#   client connected : weston 26% + mirror 189%, app drops to 52 fps
# The expensive part is encoding for a live viewer, not the mirror sitting idle.
#
# SECURITY: weston's RDP backend does no authentication whatsoever (NlaSecurity is
# hard-disabled and nothing replaces it). TLS encrypts the link; it does not
# authorise anyone. With this on by default, any host that can reach port 3389 gets
# full interactive control of the head unit, including the OTA approval prompt.

[Unit]
Wants=weston-rdp-tls.service weston-headless-output.service
After=weston-rdp-tls.service weston-headless-output.service

[Service]
# The empty assignment is required: without it systemd APPENDS to ExecStart and
# refuses to start a service that ends up with two of them.
#
# This restates poky's weston.service ExecStart plus --config. If that unit ever gains
# another flag, this line has to be updated to match; `weston-remote-display status`
# prints the config weston actually loaded, which is how you catch the drift.
ExecStart=
ExecStart=/usr/bin/weston --modules=systemd-notify.so --config=/etc/xdg/weston/weston-rdp.ini
