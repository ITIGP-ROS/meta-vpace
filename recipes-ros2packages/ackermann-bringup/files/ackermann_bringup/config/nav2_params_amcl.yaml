amcl:
  ros__parameters:
    use_sim_time: false
    # Alpha params: motion model noise for particle spread during prediction
    # alpha1: rot noise from rot,  alpha2: rot noise from trans
    # alpha3: trans noise from trans, alpha4: trans noise from rot
    # For Ackermann: during turns the robot translates AND rotates simultaneously,
    # so alpha3+alpha4 need to be generous to prevent particle collapse during cornering.
    alpha1: 0.1   # Rotation noise from rotation (reduce over-spreading when spinning)
    alpha2: 0.2   # Rotation noise from translation (keep moderate)
    alpha3: 0.3   # Translation noise from translation (Ackermann slips slightly)
    alpha4: 0.3   # Translation noise from rotation (KEY: spread particles wider in turns)
    alpha5: 0.1   # Only used by omnidirectional model
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: true
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0
    laser_min_range: 0.2
    laser_model_type: "likelihood_field_prob"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.65
    z_max: 0.0
    z_rand: 0.35
    z_short: 0.0
    scan_topic: scan

