# Disable the Tegra Security Engine as a kernel crypto provider.
#
# WHY: it oopses and takes the board down with it.
#
# Captured on the unit 2026-08-18 (L4T r36.5, BIOS v36.5.0), via a persistent
# /dev/kmsg capture on /data -- the journal is volatile, so every earlier crash had
# erased its own evidence:
#
#   Internal error: Oops: 0000000096000044 [#1] PREEMPT SMP
#   CPU: 1 PID: 633 Comm: 15820000.crypto  Tainted: G           O
#   pc : crypto_dequeue_request+0x58/0x90
#   Call trace:
#     crypto_dequeue_request+0x58/0x90
#     crypto_pump_work+0x10c/0x364 [crypto_engine]
#     kthread_worker_fn+0xb8/0x280
#
# THE DECODE, because it identifies the defect precisely:
#
#   [0000000000000008] pgd=0000000000000000   faulting address is 0x8 -- NULL+8
#   WnR = 1                                    it was a WRITE
#   Code: ... (f9000462)  =  str x2, [x3, #8]  with x3 = 0
#   x1 : dead000000000100                      <-- LIST_POISON1
#   x4 : dead000000000122                      <-- the matching poison
#
# LIST_POISON only appears in a list_head AFTER it has been deleted. The crypto
# engine's request queue is therefore walking an entry that was already removed --
# a use-after-free / double-delete in the queue -- and dereferences NULL writing to it.
#
# HOW IT REBOOTS THE BOARD: the oops kills the 15820000.crypto kthread. Anything
# waiting on that crypto queue then blocks forever, the kernel stops making progress,
# and the CCPLEX watchdog resets the SoC. The reset reason register reads BCCPLEXWDT.
# Observed gap between oops and reset: 1-2 minutes.
#
# WHAT TRIGGERS IT: WPA2 WiFi.
#
#   mac80211 allocates ccm(aes) for CCMP, and tegra_se registers it as
#
#       name: ccm(aes)   driver: ccm-aes-tegra   module: tegra_se
#       priority: 500    refcnt: 3               type: aead
#
#   500 beats the ARM crypto-extensions implementation ccm-aes-ce at 300, so every
#   software-path WPA2 frame is routed into the SE's async engine. refcnt 3 is
#   mac80211 holding live transforms (pairwise + group keys) -- it is the ONLY
#   tegra-se algorithm with a refcount above 1, i.e. the only one actually in use.
#
#   NOTE FOR THE NEXT PERSON: the driver is called "ccm-aes-tegra", NOT "tegra-se-*"
#   like the hash algorithms. Grepping /proc/crypto for "tegra-se" misses it entirely
#   and makes the engine look idle. That cost hours here.
#
#   NVIDIA has this reported against a different WiFi driver, same crash:
#   https://forums.developer.nvidia.com/t/tegra-se-interfering-with-driver-rtw88/361073
#   Same oops in crypto_dequeue_request, same trigger (WPA2/WPA3), and blacklisting
#   tegra_se is the accepted workaround there too. NVIDIA's own suggestion in that
#   thread is to disable the crypto accelerators and fall back to software.
#
#   Consistent with history on this unit: the board was stable on the MT7601U USB
#   dongle and began resetting once the Intel 8265 M.2 card joined a WPA2 network.
#
# WHY BLACKLISTING IS SAFE:
#
#   tegra_se registers hmac(sha1/224/256/384/512), sha3-*, sha*, cmac(aes) at
#   PRIORITY 300, which outranks the software implementations (~100), so it silently
#   captures every in-kernel request for those algorithms. Remove it and the crypto
#   API falls back to the generic software versions -- functionally identical, slower
#   on large hashes, and nothing on this board is crypto-bound.
#
#   OP-TEE is unaffected. Secure-world crypto runs in TrustZone and reaches the SE
#   hardware directly; this only removes the driver's Linux-side crypto API registration.
#
#   No module depends on it: `lsmod` showed "tegra_se 61440 2" with an EMPTY Used-by
#   column, i.e. the refcount is from crypto API registrations, not module deps.
#
# WHAT IT WAS *NOT* -- three wrong turns, recorded so nobody repeats them:
#   - NOT the CAN bus. can0 was in a genuine bus-off storm (400+ cycles from
#     disconnected wires, plus a real mttcan can_put_echo_skb BUG), but the board ran
#     20+ minutes through it untouched. Correlation, not cause.
#   - NOT thermal or power. tj 61 C against a 99 C trip; 8.7 W of a 40 W budget.
#   - NOT SSH or RDP. Their TLS is userspace OpenSSL; the only route into kernel
#     crypto is AF_ALG, and there were zero such sockets. The faulting thread is a
#     kthread, not owned by any of those daemons.
#
# TO RE-ENABLE once NVIDIA fixes it: delete this file and rebuild. Confirm with
# `grep tegra-se /proc/crypto` (should list algorithms again) and watch
# /sys/devices/platform/bus@0/c360000.pmc/reset_reason for a return of BCCPLEXWDT.
blacklist tegra_se

# blacklist alone only stops ALIAS-driven autoloading; an explicit modprobe would still
# pull it in. This makes loading fail outright.
install tegra_se /bin/false
